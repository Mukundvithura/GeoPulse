# SonarCloud derives both keys from the GitHub account when it onboards the
# repository. If the project page shows different values, these must match it.
sonar.organization=mukundvithura
sonar.projectKey=Mukundvithura_GeoPulse
sonar.projectName=GeoPulse
sonar.sourceEncoding=UTF-8

# api/, collector/ and config.py are the Python; web/index.html carries the
# whole frontend, and SonarJS analyses the <script> block inside it.
sonar.sources=api,collector,web,config.py
sonar.tests=tests

# countries.geojson is Natural Earth data, not authored code.
sonar.exclusions=web/countries.geojson,**/__pycache__/**,**/.pytest_cache/**,.claude/**

sonar.python.version=3.12

# Written by the `pytest --cov-report=xml` step in .github/workflows/sonar.yml.
sonar.python.coverage.reportPaths=coverage.xml

# SCM blame is left enabled: SonarCloud needs it to attribute issues to the
# new-code period. The workflow checks out with fetch-depth: 0 so the blame
# is complete.
