# Configuration for SonarQube Cloud's Automatic Analysis, which scans the
# repository server-side with no CI job and no token.
#
# Automatic Analysis reads this file, NOT sonar-project.properties -- that one
# is read by the scanner in .github/workflows/sonar.yml, which is currently
# manual-only because the two modes cannot both be enabled.

# api/, collector/ and config.py are the Python; web/index.html carries the
# whole frontend, and SonarJS analyses the <script> block inside it.
sonar.sources=api,collector,web,config.py
sonar.tests=tests

# countries.geojson is Natural Earth data, not authored code.
sonar.exclusions=web/countries.geojson,**/__pycache__/**,**/.pytest_cache/**,.claude/**
