services:
  db:
    image: postgres:16-alpine
    container_name: geopulse-db
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    ports:
      - "6543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in phase order on first boot of an empty volume. The numeric
      # prefix is container-side only, so the files keep their names on disk.
      # phase4 has an FK onto phase2's articles table, so order matters.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./schema_phase2.sql:/docker-entrypoint-initdb.d/02-schema_phase2.sql
      - ./schema_phase3.sql:/docker-entrypoint-initdb.d/03-schema_phase3.sql
      - ./schema_phase4.sql:/docker-entrypoint-initdb.d/04-schema_phase4.sql

  graph:
    image: memgraph/memgraph:latest
    container_name: geopulse-graph
    ports:
      - "7687:7687"

volumes:
  pgdata:
