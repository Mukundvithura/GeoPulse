<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/globe.gl@2.34.5/dist/globe.gl.min.js"></script>
<style>
  :root {
    /* chart paper + engraved ink */
    --paper:      #E9E7DC;
    --paper-deep: #DFDCCD;
    --ink:        #16252E;
    --ink-2:      #47585F;
    --ink-3:      #54626A;
    --survey:     #6E8CA0;
    --rule:       #B6AC93;
    --rule-fine:  #CCC3AC;

    /* activity tints — chart tint vocabulary, monotonic in weight */
    --t-none:     #E9E7DC;
    --t-stable:   #CCC3A4;
    --t-elevated: #DFB24C;
    --t-breaking: #CE7724;
    --t-conflict: #C2185B;

    --frame: 15px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 13.5px; font-weight: 400; line-height: 1.5;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- browser surfaces, themed from the chart palette ---- */
  ::selection { background: var(--t-conflict); color: #FFF7FA; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--paper-deep); border-left: 1px solid var(--rule-fine); }
  ::-webkit-scrollbar-thumb { background: var(--rule); border: 3px solid var(--paper-deep); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-2); }
  * { scrollbar-width: thin; scrollbar-color: var(--rule) var(--paper-deep); }
  :focus-visible { outline: 2px solid var(--t-conflict); outline-offset: 2px; }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px;
      text-underline-offset: 2.5px; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: var(--t-conflict); color: var(--t-conflict); }

  /* ---- the sheet: graduated tick border, chart tooth ---- */
  #sheet {
    position: fixed; inset: 0;
    padding: var(--frame);
    background:
      repeating-linear-gradient(90deg, var(--ink) 0 9px, transparent 9px 18px) left top / 100% 5px repeat-x,
      repeating-linear-gradient(90deg, var(--ink) 0 9px, transparent 9px 18px) left bottom / 100% 5px repeat-x,
      repeating-linear-gradient(180deg, var(--ink) 0 9px, transparent 9px 18px) left top / 5px 100% repeat-y,
      repeating-linear-gradient(180deg, var(--ink) 0 9px, transparent 9px 18px) right top / 5px 100% repeat-y,
      url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='t'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23t)' opacity='0.05'/%3E%3C/svg%3E"),
      var(--paper);
  }
  #field {
    position: absolute; inset: var(--frame);
    border: 1px solid var(--ink);
    overflow: hidden;
  }
  #globe { position: absolute; inset: 0; }

  /* ---- chart panels: ruled blocks in the sheet's clear areas ---- */
  .block {
    position: absolute; z-index: 10;
    background: rgba(233, 231, 220, 0.94);
    border: 1px solid var(--ink);
    padding: 10px 13px 12px;
  }
  .block h2, .block h3 { margin: 0; }

  .tblock { top: 0; left: 0; width: 336px; border-width: 0 1px 1px 0; }
  .tblock h1 {
    margin: 0;
    font-family: "Spectral", Georgia, serif;
    font-size: 25px; font-weight: 600; line-height: 1;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .tblock .sub {
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 11.5px; font-weight: 400; line-height: 1;
    letter-spacing: .17em; text-transform: uppercase; color: var(--ink-2);
    margin-top: 5px;
  }
  .rule    { height: 1px; background: var(--ink); margin: 9px 0; }
  .rule-f  { height: 1px; background: var(--rule-fine); margin: 8px 0; }

  .meta-row { display: flex; justify-content: space-between; flex-wrap: wrap;
              gap: 2px 14px;
              font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
              color: var(--ink-2); }
  .meta-row > * { min-width: 0; }
  .meta-row b { color: var(--ink); font-weight: 600; letter-spacing: 0; }

  #search {
    width: 100%; margin-top: 9px;
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 13.5px; font-weight: 400; line-height: 1.6;
    padding: 2px 0; outline: none;
  }
  #search::placeholder { color: var(--ink-3); font-style: italic;
                         font-family: "Spectral", Georgia, serif; }
  #search:focus { border-bottom-color: var(--t-conflict); }

  /* tint key, lower left */
  .keyblock { bottom: 0; left: 0; width: 336px; border-width: 1px 1px 0 0; }
  .label {
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 11px; font-weight: 600; line-height: 1;
    letter-spacing: .19em; text-transform: uppercase; color: var(--ink-2);
  }
  .keys-head {
    display: flex; margin-top: 9px; padding-bottom: 5px;
    border-bottom: 1px solid var(--rule-fine);
    font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .keys-head b { margin-left: auto; font-weight: 600; width: 2.4em;
                 text-align: right; letter-spacing: 0; }
  .keys { display: grid; gap: 5px; margin-top: 7px; }
  .keys div { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .keys b { font-weight: 600; width: 2.4em; text-align: right; }
  .sw { width: 26px; height: 11px; border: 1px solid var(--ink); flex: none; }
  .sw-conflict {
    background:
      repeating-linear-gradient(45deg, #8E0F40 0 2px, transparent 2px 5px),
      var(--t-conflict);
  }
  .keys small { margin-left: auto; color: var(--ink-3); font-size: 11px;
                letter-spacing: .06em; }

  /* right column: reliability diagram over the active-areas register */
  #rightcol {
    position: absolute; top: 0; right: 0; bottom: 0; width: 248px; z-index: 10;
    border-left: 1px solid var(--ink);
    background: rgba(233, 231, 220, 0.94);
    display: flex; flex-direction: column;
    animation: ink .62s cubic-bezier(.16,1,.3,1) .16s both;
  }
  #rightcol[hidden] { display: none; }
  #rightcol .block { position: static; border: 0; animation: none;
                     background: transparent; }
  .relblock { border-bottom: 1px solid var(--ink) !important; }
  .actblock { flex: 1; min-height: 0; display: flex; flex-direction: column;
              padding-bottom: 11px; }

  /* multi-source share, plotted against a graduated scale */
  .plot { margin: 11px 0 0; }
  .plot-bar { position: relative; height: 17px; border: 1px solid var(--ink);
              background: var(--paper-deep); overflow: hidden; }
  .plot-bar span { display: block; height: 100%; background: var(--survey); }
  .plot-bar i { position: absolute; top: 0; bottom: 0; width: 1px;
                background: var(--ink); opacity: .45; }
  .plot-axis { display: flex; justify-content: space-between; margin-top: 3px;
               font-size: 11px; letter-spacing: .06em; color: var(--ink-3); }
  .plot .meta-row { margin-top: 8px; }

  #active { margin-top: 9px; overflow-y: auto; flex: 1; min-height: 0;
            margin-right: -13px; padding-right: 9px; }
  .act-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: 0; border-bottom: 1px solid var(--rule-fine);
    padding: 6px 0; cursor: pointer; text-align: left;
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 13.5px; font-weight: 400; line-height: 1.35; color: var(--ink);
  }
  .act-row:hover { background: var(--paper-deep); }
  .act-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-row .n { margin-left: auto; font-weight: 600; font-size: 13.5px; }
  .act-row .u { color: var(--ink-3); font-size: 11px; letter-spacing: .06em; }

  /* ---- inset panel ---- */
  #inset {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(432px, 94vw);
    z-index: 30; background: var(--paper);
    border-left: 1px solid var(--ink);
    padding: 0; overflow-y: auto; display: none;
  }
  #inset.open { display: block; }
  #inset .pad { padding: 12px 16px 28px; }
  .inset-head {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper); border-bottom: 1px solid var(--ink);
    padding: 11px 16px 10px;
  }
  .inset-head h2 {
    font-family: "Spectral", Georgia, serif;
    font-size: 22px; font-weight: 500; line-height: 1.1; letter-spacing: .015em;
    padding-right: 34px; display: flex; align-items: baseline; gap: 10px;
  }
  .inset-head h2 .desig {
    margin-left: auto; flex: none;
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 11px; font-weight: 600; line-height: 1;
    letter-spacing: .19em; text-transform: uppercase; color: var(--ink-2);
  }
  .iso { color: var(--ink-3); font-size: 15px; letter-spacing: .08em; }
  .close {
    position: absolute; top: 11px; right: 14px;
    width: 24px; height: 24px; padding: 0; cursor: pointer;
    background: transparent; border: 1px solid var(--rule); color: var(--ink);
    display: grid; place-items: center;
  }
  .close:hover { border-color: var(--t-conflict); color: var(--t-conflict); }

  .class-line {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--ink); padding: 8px 11px; margin-bottom: 14px;
  }
  .class-line .sw { width: 34px; height: 14px; }
  .class-line b { font-size: 13.5px; letter-spacing: .15em; text-transform: uppercase; }

  .figs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
  .figs div { padding: 8px 11px 9px; border-right: 1px solid var(--rule-fine);
              border-bottom: 1px solid var(--rule-fine); }
  .figs div:nth-child(2n) { border-right: 0; }
  .figs div:nth-last-child(-n+2) { border-bottom: 0; }
  .figs b { display: block; font: 600 21px/1.1 "Spectral", Georgia, serif; }
  .figs small { color: var(--ink-2); font-size: 11px; letter-spacing: .08em;
                text-transform: uppercase; }

  .note {
    font-family: "Spectral", Georgia, serif;
    font-size: 14.5px; font-weight: 400; line-height: 1.6; font-style: italic;
    color: var(--ink); border-left: 1px solid var(--ink); padding-left: 13px;
    margin: 14px 0 0;
  }
  .note.pending { color: var(--ink-3); }

  h3.sec {
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 11px; font-weight: 600; line-height: 1;
    letter-spacing: .19em; text-transform: uppercase; color: var(--ink-2);
    margin: 22px 0 0; padding-bottom: 7px; border-bottom: 1px solid var(--ink);
  }

  .row { padding: 9px 0; border-bottom: 1px solid var(--rule-fine); font-size: 13.5px; }
  .row .who { line-height: 1.45; }
  .row .m {
    color: var(--ink-2); font-size: 11.5px; letter-spacing: .05em;
    text-transform: uppercase; margin-top: 3px;
  }
  .row .m a { letter-spacing: .05em; }
  .act { color: var(--t-conflict); font-style: italic;
         font-family: "Spectral", Georgia, serif; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { border: 1px solid var(--rule); padding: 0 6px; font-size: 11px;
          color: var(--ink-2); letter-spacing: .04em; }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  button.chip { background: transparent; cursor: pointer;
                font-family: inherit; line-height: 1.5; }

  .conf { display: inline-flex; gap: 2px; vertical-align: 1px; margin-left: 5px; }

  .watch {
    margin-top: 9px; cursor: pointer; background: transparent;
    border: 1px solid var(--ink); color: var(--ink);
    font-family: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    font-size: 11px; font-weight: 600; line-height: 1;
    letter-spacing: .17em; text-transform: uppercase; padding: 6px 11px;
  }
  .watch[aria-pressed="true"] { background: var(--t-conflict); color: #FFF7FA;
                                border-color: var(--t-conflict); }
  .watch:hover { border-color: var(--t-conflict); }

  /* ---- leader line: inset tied to its source rectangle ---- */
  #leader { position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: none; }
  #leader line, #leader rect { stroke: var(--ink); fill: none; }

  /* ---- ink-laying entrance ---- */
  @keyframes ink { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .block { animation: ink .62s cubic-bezier(.16,1,.3,1) both; }
  .tblock   { animation-delay: .04s; }
  .relblock { animation-delay: .16s; }
  .keyblock { animation-delay: .26s; }
  #inset.open { animation: rise .34s cubic-bezier(.16,1,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .block, #inset.open { animation: none; }
  }

  /* ---- narrow ---- */
  @media (max-width: 820px) {
    /* the sheet becomes one scrolling column; nothing is dropped */
    :root { --frame: 9px; }
    #field { display: flex; flex-direction: column; overflow-y: auto; }
    .tblock, .keyblock, #rightcol {
      position: static; width: auto; flex: none;
      border-width: 0 0 1px 0; border-style: solid; border-color: var(--ink);
      background: transparent; animation: none;
    }
    #globe { position: relative; inset: auto; order: 2; height: 54vh; flex: none; }
    .tblock   { order: 1; }
    .keyblock { order: 3; }
    #rightcol { order: 4; border-bottom: 0; }
    .tblock h1 { font-size: 21px; }
    .keys { grid-template-columns: 1fr; }
    .keys b { margin-left: auto; }
    .keys small { display: none; }
    .actblock { flex: none; }
    #active { overflow: visible; max-height: none; }
    #inset { position: fixed; inset: 0; width: 100%; border-left: 0; }
    #leader { display: none; }
  }
</style>
</head>
<body>
<div id="sheet">
  <div id="field">
    <div id="globe"></div>
    <svg id="leader" aria-hidden="true"></svg>

    <div class="block tblock">
      <h1>GeoPulse</h1>
      <div class="sub">Geopolitical Activity Chart</div>
      <div class="rule"></div>
      <div class="meta-row">
        <span>Survey <b>GDELT 2.0 &middot; World news</b></span>
        <span>Window <b>3 d</b></span>
      </div>
      <div class="meta-row" style="margin-top:4px">
        <span>Corrected <b id="dtg">&mdash;</b></span>
        <span id="status">Reading&hellip;</span>
      </div>
      <label class="label" for="search" style="display:block;margin-top:11px">Index</label>
      <input id="search" type="search" placeholder="Search events and news, then press Enter">
    </div>

    <div id="rightcol">
      <div class="block relblock">
        <span class="label">Reliability of survey</span>
        <div class="plot" id="zoc"></div>
      </div>
      <div class="block actblock">
        <span class="label">Most active areas</span>
        <div class="meta-row" style="margin-top:8px">
          <span>Area</span><span>Violent events</span>
        </div>
        <div id="active"></div>
      </div>
    </div>

    <div class="block keyblock">
      <span class="label">Tint key &middot; activity class</span>
      <div class="keys-head"><span>Class</span><b>Areas</b></div>
      <div class="keys" id="keys"></div>
    </div>

    <div id="inset" aria-live="polite"></div>
  </div>
</div>

<script>
const TINT = {
  none:     getCSS("--t-none"),
  stable:   getCSS("--t-stable"),
  elevated: getCSS("--t-elevated"),
  breaking: getCSS("--t-breaking"),
  conflict: getCSS("--t-conflict"),
};
function getCSS(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* An href is an attribute, not text: entity-escaping alone still lets
   javascript: and data: through. Anything that is not http(s) is refused. */
function safeUrl(u) {
  if (!u) return "";
  try {
    const p = new URL(String(u), location.href);
    return (p.protocol === "http:" || p.protocol === "https:") ? p.href : "";
  } catch { return ""; }
}
/* A source link, or — when the URL cannot be trusted — the label as plain
   text. A refused URL reads as absent rather than as a link to nowhere. */
function sourceLink(u, label) {
  const s = safeUrl(u);
  return s ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(label)}</a>`
           : esc(label);
}
/* ISO3 is the only server value that reaches a JS string inside an inline
   handler, so it is validated rather than escaped: three letters or nothing. */
function isoAttr(iso3) {
  return /^[A-Za-z]{3}$/.test(String(iso3)) ? String(iso3).toUpperCase() : "";
}
function tint(level) { return TINT[level] || TINT.none; }

const LEVELS = [
  ["stable",   "Stable",   "routine activity"],
  ["elevated", "Elevated", "conflict events rising"],
  ["breaking", "Breaking", "sustained violent events"],
  ["conflict", "Conflict", "highest violent share"],
  ["none",     "No signal", "no events filed"],
];

const CAMEO_ROOT = {
  "01":"Statement","02":"Appeal","03":"Intent to cooperate","04":"Consult",
  "05":"Diplomatic cooperation","06":"Material cooperation","07":"Aid",
  "08":"Yield","09":"Investigate","10":"Demand","11":"Disapprove",
  "12":"Reject","13":"Threaten","14":"Protest","15":"Show force",
  "16":"Reduce relations","17":"Coerce","18":"Assault","19":"Fight",
  "20":"Mass violence",
};

const inset    = document.getElementById("inset");
const statusEl = document.getElementById("status");
const leader   = document.getElementById("leader");
let riskByIso = {};
let openIso = null, openCentroid = null;
const NAMES = {};
const FEATURES = {};
let surveyable = 0;

/* ---------- authored marks (no glyph icons) ---------- */
function confMark(level) {
  const filled = { high: 3, medium: 2, low: 1 }[level] || 0;
  const boxes = [0, 1, 2].map(i =>
    `<rect x="${i * 5 + .5}" y="${i === 0 ? 5.5 : i === 1 ? 3.5 : 1.5}"
       width="3" height="${i === 0 ? 3 : i === 1 ? 5 : 7}"
       fill="${i < filled ? "var(--ink)" : "none"}"
       stroke="var(--ink-3)" stroke-width="1"/>`).join("");
  return `<span class="conf" title="Confidence: ${esc(level)} (source count)">
    <svg width="14" height="10" viewBox="0 0 14 10" aria-label="confidence ${esc(level)}"
      role="img">${boxes}</svg></span>`;
}
const CLOSE_MARK = `<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
  <path d="M1 1 L10 10 M10 1 L1 10" stroke="currentColor" stroke-width="1.4"/></svg>`;

/* ---------- tint key: the levels, and how many areas sit in each ---------- */
function renderKeys(risks) {
  document.getElementById("keys").innerHTML = LEVELS.map(([id, name, gloss]) => {
    const n = !risks ? null
      : id === "none" ? Math.max(0, surveyable - risks.length)
      : risks.filter(r => r.level === id).length;
    return `<div><i class="sw ${id === "conflict" ? "sw-conflict" : ""}"
      style="${id === "conflict" ? "" : `background:${TINT[id]}`}"></i>
      <span>${name}</span><small>${gloss}</small>${
        n === null ? "" : `<b>${n}</b>`}</div>`;
  }).join("");
}
renderKeys(null);

/* ---------- DTG stamp ---------- */
function dtg() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const mon = ["JAN","FEB","MAR","APR","MAY","JUN",
               "JUL","AUG","SEP","OCT","NOV","DEC"][d.getUTCMonth()];
  document.getElementById("dtg").textContent =
    `${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}Z ${mon}`;
}
dtg(); setInterval(dtg, 30000);

/* ---------- the charted sphere ---------- */
const globe = Globe()(document.getElementById("globe"))
  .backgroundColor("rgba(0,0,0,0)")
  .showAtmosphere(false)
  .showGraticules(true)
  .polygonAltitude(0.006)
  .polygonStrokeColor(() => getCSS("--ink"))
  .polygonSideColor(() => "rgba(22,37,46,0.18)")
  .polygonCapColor(f => tint((riskByIso[f.properties.ADM0_A3] || {}).level))
  .polygonLabel(f => {
    const r = riskByIso[f.properties.ADM0_A3];
    const name = f.properties.NAME || f.properties.ADM0_A3;
    return `<div style="font:600 12px 'Archivo Narrow','Arial Narrow',system-ui,sans-serif;background:#E9E7DC;
      color:#16252E;border:1px solid #16252E;padding:4px 8px;letter-spacing:.06em">
      ${esc(name.toUpperCase())}<br>
      <span style="font-weight:400;color:#47585F">${
        r ? esc(r.level) + " &middot; " + esc(r.total) + " events" : "no signal"
      }</span></div>`;
  })
  .onPolygonClick(f => openInset(f.properties.ADM0_A3, f.properties.NAME, f));

// flatten the shading: a chart is engraved, not lit
const gm = globe.globeMaterial();
gm.color.set("#9DB9C3");
gm.emissive.set("#6F8C97");
gm.emissiveIntensity = 0.5;
gm.shininess = 0;

// fit the sphere to the clear area between the chart's margins
const globeEl = document.getElementById("globe");
function sizeGlobe() {
  globe.width(globeEl.clientWidth).height(globeEl.clientHeight);
}
function fit() {
  sizeGlobe();
  globe.pointOfView({ altitude: window.innerWidth <= 820 ? 2.35 : 1.85 }, 0);
}
fit();
new ResizeObserver(sizeGlobe).observe(globeEl);
window.addEventListener("resize", () => { if (!openIso) fit(); });

/* ---------- load + refresh ---------- */
async function load() {
  try {
    const [geoRes, riskRes] = await Promise.all([
      fetch("countries.geojson"),
      fetch("/api/countries"),
    ]);
    const geo = await geoRes.json();
    const risks = await riskRes.json();
    for (const f of geo.features) {
      NAMES[f.properties.ADM0_A3] = f.properties.NAME || f.properties.ADM0_A3;
      FEATURES[f.properties.ADM0_A3] = f;
    }
    const oldRisk = riskByIso;
    riskByIso = Object.fromEntries(risks.map(r => [r.iso3, r]));
    if (Object.keys(oldRisk).length) checkAlerts(oldRisk, riskByIso);
    const plotted = geo.features.filter(f => f.properties.ADM0_A3 !== "ATA");
    surveyable = plotted.length;
    globe.polygonsData(plotted);
    statusEl.innerHTML = `<b>${risks.length}</b> areas active`;
    surveyQuality(risks);
    const deep = location.hash.slice(1).toUpperCase();
    if (!openIso && /^[A-Z]{3}$/.test(deep) && FEATURES[deep]) {
      openInset(deep, NAMES[deep], FEATURES[deep]);
    }
  } catch {
    statusEl.textContent = "Survey unavailable";
  }
}

function surveyQuality(risks) {
  renderKeys(risks);

  const tot = risks.reduce((a, r) => a + r.total, 0);
  const ms = risks.reduce((a, r) => a + (r.multi_source || 0), 0);
  const pct = tot ? Math.round(100 * ms / tot) : 0;
  document.getElementById("zoc").innerHTML = `
    <div class="plot-bar" role="img"
      aria-label="${pct}% of filed events confirmed by two or more sources">
      <span style="width:${pct}%"></span>
      <i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i>
    </div>
    <div class="plot-axis"><span>0</span><span>25</span><span>50</span>
      <span>75</span><span>100%</span></div>
    <div class="meta-row"><span>Confirmed by 2+ sources</span><b>${pct}%</b></div>
    <div class="meta-row"><span>Events filed</span><b>${tot.toLocaleString()}</b></div>
    <div class="meta-row"><span>Areas reporting</span><b>${risks.length}</b></div>`;

  const order = { conflict: 3, breaking: 2, elevated: 1, stable: 0 };
  document.getElementById("active").innerHTML = risks
    .slice()
    .sort((a, b) => (order[b.level] - order[a.level]) || (b.violent - a.violent)
                    || (b.total - a.total))
    .slice(0, 24)
    .map(r => `<button class="act-row" onclick="openInset('${isoAttr(r.iso3)}')">
        <i class="sw" style="background:${tint(r.level)}"></i>
        <span class="nm">${esc(NAMES[r.iso3] || r.iso3)}</span>
        <span class="n">${esc(r.violent)}</span></button>`).join("");
}

/* ---------- the inset ---------- */
function insetHead(title, sub, iso3) {
  return `<div class="inset-head">
    <h2>${esc(title)}${iso3 ? ` <span class="iso">${esc(iso3)}</span>` : ""
      }<span class="desig">${esc(sub)}</span></h2>
    <button class="close" onclick="closeInset()" aria-label="Close inset">${CLOSE_MARK}</button>
  </div>`;
}

function closeInset() {
  inset.classList.remove("open");
  document.getElementById("rightcol").hidden = false;
  openIso = null; openCentroid = null;
  clearLeader();
  if (location.hash) history.replaceState(null, "", location.pathname);
  fit();
}
window.closeInset = closeInset;

async function openInset(iso3, name, feature) {
  name = name || NAMES[iso3] || iso3;
  openIso = iso3;
  const f = feature || FEATURES[iso3];
  openCentroid = f ? centroid(f) : null;
  if (openCentroid) globe.pointOfView(
    { lat: openCentroid[0], lng: openCentroid[1],
      altitude: window.innerWidth <= 820 ? 2.2 : 1.7 }, 700);

  if (location.hash.slice(1) !== iso3) history.replaceState(null, "", "#" + iso3);
  document.getElementById("rightcol").hidden = true;
  inset.classList.add("open");
  inset.scrollTop = 0;
  inset.innerHTML = insetHead(name, "Inset A") +
    `<div class="pad"><p class="note pending">Reading survey&hellip;</p></div>`;

  const res = await fetch(`/api/country/${iso3}`);
  if (!res.ok) {
    inset.innerHTML = insetHead(name, "Inset A") +
      `<div class="pad"><p class="note pending">No events filed for this area
       in the last 3 days. The area is surveyed but blank.</p></div>`;
    return;
  }
  const d = await res.json();
  const b = d.breakdown;
  const pct = b.total ? Math.round(100 * b.multi_source / b.total) : 0;
  const watched = getWatchlist().includes(iso3);
  const levelName = (LEVELS.find(l => l[0] === d.level) || [, d.level])[1];

  inset.innerHTML = insetHead(name, "Inset A", iso3) + `
    <div class="pad">
      <div class="class-line">
        <i class="sw ${d.level === "conflict" ? "sw-conflict" : ""}"
           style="${d.level === "conflict" ? "" : `background:${tint(d.level)}`}"></i>
        <b>${esc(levelName)}</b>
        <span style="margin-left:auto;color:var(--ink-2);font-size:11.5px;
          letter-spacing:.08em;text-transform:uppercase">${esc(d.window_days)}-day window</span>
      </div>

      <button class="watch" aria-pressed="${watched}"
        onclick="toggleWatch('${isoAttr(iso3)}')">
        ${watched ? "Watching this area" : "Watch this area"}</button>

      <h3 class="sec">Counts</h3>
      <div class="figs" style="margin-top:10px">
        <div><b>${esc(b.total)}</b><small>events filed</small></div>
        <div><b>${esc(b.quad4)}</b><small>material conflict</small></div>
        <div><b>${esc(b.violent)}</b><small>assault, fight, mass violence</small></div>
        <div><b>${esc(pct)}%</b><small>confirmed by 2+ sources</small></div>
      </div>

      <div id="related"></div>
      <div id="relations"></div>

      ${d.headlines && d.headlines.length ? `
        <h3 class="sec">Headlines</h3>
        ${d.headlines.map(h => `
          <div class="row">
            <div class="who">${sourceLink(h.url, h.title)}</div>
            <div class="m">${esc(h.source)}${h.published ? " &middot; " + esc(h.published.slice(0, 16)) : ""}</div>
            ${h.entities && h.entities.length ? `<div class="chips">${
              h.entities.slice(0, 6).map(e => `<span class="chip">${esc(e.text)}</span>`).join("")
            }</div>` : ""}
          </div>`).join("")}` : ""}

      <h3 class="sec">Events</h3>
      ${d.events.map(e => `
        <div class="row">
          <div class="who">${esc(e.actor1 || "Unattributed")} &rarr; ${esc(e.actor2 || "Unattributed")}
            &middot; ${esc(CAMEO_ROOT[e.cameo_root] || e.cameo_root)}${confMark(e.confidence)}</div>
          <div class="m">${esc(e.date)}${e.place ? " &middot; " + esc(e.place) : ""} &middot;
            ${esc(e.articles)} articles${safeUrl(e.url)
              ? ` &middot; ${sourceLink(e.url, "source")}` : ""}</div>
        </div>`).join("")}
    </div>`;

  loadRelated(iso3);
  loadRelations(iso3);
}
window.openInset = openInset;

/* ---------- leader line: inset tied to its source rectangle ---------- */
function centroid(f) {
  const g = f.geometry;
  const rings = g.type === "Polygon" ? [g.coordinates[0]]
              : g.coordinates.map(p => p[0]);
  let best = rings[0], bestLen = 0;
  for (const r of rings) if (r.length > bestLen) { bestLen = r.length; best = r; }
  let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
  for (const [lng, lat] of best) {
    if (lng < x0) x0 = lng; if (lng > x1) x1 = lng;
    if (lat < y0) y0 = lat; if (lat > y1) y1 = lat;
  }
  return [(y0 + y1) / 2, (x0 + x1) / 2];
}

function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  e.setAttribute("stroke", "#16252E");
  e.setAttribute("stroke-width", "1");
  e.setAttribute("fill", "none");
  return e;
}
function clearLeader() { leader.replaceChildren(); }

function drawLeader() {
  if (!openCentroid || !inset.classList.contains("open")
      || window.innerWidth <= 820) { clearLeader(); return; }
  if (typeof globe.getScreenCoords !== "function") return;
  const c = globe.getScreenCoords(openCentroid[0], openCentroid[1], 0.006);
  if (!c || !visible(openCentroid)) { clearLeader(); return; }
  const fr = document.getElementById("field").getBoundingClientRect();
  const gr = globeEl.getBoundingClientRect();
  const x = c.x + (gr.left - fr.left), y = c.y + (gr.top - fr.top);
  const tx = inset.getBoundingClientRect().left - fr.left, ty = 58;
  if (x > tx - 24) { clearLeader(); return; }
  leader.replaceChildren(
    svgEl("rect", { x: x - 9, y: y - 9, width: 18, height: 18 }),
    svgEl("line", { x1: x + 9, y1: y, x2: tx - 18, y2: ty }),
    svgEl("line", { x1: tx - 18, y1: ty, x2: tx, y2: ty }));
}

// visible when the point lies on the hemisphere the camera is looking at
function visible([lat, lng]) {
  const pov = globe.pointOfView();
  const r = Math.PI / 180;
  const cos = Math.sin(pov.lat * r) * Math.sin(lat * r)
            + Math.cos(pov.lat * r) * Math.cos(lat * r)
              * Math.cos((lng - pov.lng) * r);
  return cos > 0.25;
}
(function tick() { drawLeader(); requestAnimationFrame(tick); })();

/* ---------- supplementary blocks ---------- */
async function loadRelations(iso3) {
  const el = document.getElementById("relations");
  if (!el) return;
  try {
    const rows = await (await fetch(`/api/country/${iso3}/relations`)).json();
    if (!rows.length) return;
    el.innerHTML = `<h3 class="sec">Reported actions</h3>` + rows.map(r => `
      <div class="row">
        <div class="who"><b>${esc(r.actor)}</b> <span class="act">${esc(r.action)}</span>
          <b>${esc(r.target)}</b>${r.instrument
            ? ` <span style="color:var(--ink-2)">using ${esc(r.instrument)}</span>` : ""}</div>
        <div class="m">${sourceLink(r.url, "source")}</div>
      </div>`).join("");
  } catch { /* extractor has not run */ }
}

async function loadRelated(iso3) {
  const el = document.getElementById("related");
  if (!el) return;
  try {
    const rows = await (await fetch(`/api/country/${iso3}/related`)).json();
    if (!rows.length) return;
    el.innerHTML = `<h3 class="sec">Adjoining areas &middot; shared actors</h3>
      <div class="chips" style="margin-top:9px">` + rows.map(r =>
        `<button class="chip" title="Linked via ${esc((r.via || []).join(", "))}"
          onclick="openInset('${isoAttr(r.iso3)}')">${esc(r.iso3)} &middot; ${esc(r.links)}</button>`
      ).join("") + `</div>`;
  } catch { /* graph offline */ }
}

/* ---------- watchlist + alerts ---------- */
function getWatchlist() {
  try { return JSON.parse(localStorage.watchlist || "[]"); } catch { return []; }
}
function toggleWatch(iso3) {
  let w = getWatchlist();
  if (w.includes(iso3)) w = w.filter(x => x !== iso3);
  else {
    w.push(iso3);
    if (Notification.permission === "default") Notification.requestPermission();
  }
  localStorage.watchlist = JSON.stringify(w);
  const btn = inset.querySelector(".watch");
  if (btn) {
    const on = w.includes(iso3);
    btn.setAttribute("aria-pressed", on);
    btn.textContent = on ? "Watching this area" : "Watch this area";
  }
}
window.toggleWatch = toggleWatch;

function checkAlerts(oldRisk, newRisk) {
  for (const iso3 of getWatchlist()) {
    const was = (oldRisk[iso3] || {}).level || "stable";
    const now = (newRisk[iso3] || {}).level || "stable";
    if (was !== now && Notification.permission === "granted") {
      new Notification(`GeoPulse: ${iso3}`, { body: `Activity class changed: ${was} → ${now}` });
    }
  }
}

/* ---------- index search ---------- */
document.getElementById("search").addEventListener("keydown", async ev => {
  if (ev.key !== "Enter") return;
  const q = ev.target.value.trim();
  if (!q) return;
  openIso = null; openCentroid = null; clearLeader();
  document.getElementById("rightcol").hidden = true;
  inset.classList.add("open");
  inset.scrollTop = 0;
  inset.innerHTML = insetHead(q, "Index search") +
    `<div class="pad"><p class="note pending">Searching the survey&hellip;</p></div>`;
  const d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
  inset.innerHTML = insetHead(q, "Index search") + `<div class="pad">
    ${d.articles.length ? `<h3 class="sec">News</h3>` + d.articles.map(a => `
      <div class="row">
        <div class="who">${sourceLink(a.url, a.title)}</div>
        <div class="m">${esc(a.source)}${(a.countries || []).length
          ? " &middot; " + esc(a.countries.join(", ")) : ""}</div>
      </div>`).join("") : ""}
    ${d.events.length ? `<h3 class="sec">Events</h3>` + d.events.map(e => `
      <div class="row">
        <div class="who">${esc(e.actor1 || "Unattributed")} &rarr; ${esc(e.actor2 || "Unattributed")}</div>
        <div class="m">${esc(e.date)} &middot; ${esc(e.iso3)}${e.place ? " &middot; " + esc(e.place) : ""}
          ${safeUrl(e.url) ? ` &middot; ${sourceLink(e.url, "source")}` : ""}</div>
      </div>`).join("") : ""}
    ${!d.articles.length && !d.events.length
      ? `<p class="note pending">Nothing in the index matches that.</p>` : ""}
  </div>`;
});

load();
setInterval(load, 60000);
</script>
